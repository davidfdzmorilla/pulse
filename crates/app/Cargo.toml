[package]
name = "app"
version = "0.1.3"
edition = "2024"

[dependencies]
eframe = "0.36.2"
engine = { version = "0.1.0", path = "../engine" }
flate2 = "1.1.10"
hound = "3.5.1"
midir = "0.11.1"
rfd = "0.17.2"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SHA-256 of downloads (the stems model, Windows updates), the same on every system.
sha2 = "0.10.9"
stems = { version = "0.1.0", path = "../stems" }
beats = { version = "0.1.0", path = "../beats" }
paths = { version = "0.1.0", path = "../paths" }

[build-dependencies]
# pulse.exe's icon and version (Windows only; see build.rs).
embed-resource = "3.0.2"

[[bin]]
name = "pulse"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "NSGraphics", "NSMenu", "NSMenuItem", "NSApplication", "NSEvent"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSString", "NSObject", "NSNotification", "NSArray", "NSEnumerator"] }
