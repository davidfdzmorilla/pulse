[package]
name = "stems"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
# ONNX Runtime, linked in (the build downloads it once).
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "download-binaries", "tls-native", "api-31"] }
rustfft = "6.4"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
hound = "3.5.1"
