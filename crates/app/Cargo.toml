[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.2"
engine = { version = "0.1.0", path = "../engine" }
flate2 = "1.1.10"
hound = "3.5.1"
midir = "0.11.1"
rfd = "0.17.2"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "pulse"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "NSGraphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSString"] }
