# Pulse on Windows x64: builds natively with MSVC, runs the tests, packs the zip
# and the installer, and checks them on the runner's clean Windows: pulse.exe
# renders a project from the command line, starts its window (a script drives
# it and takes screenshots), and the installer installs, registers .pulse files
# and uninstalls. Everything it makes is kept as artifacts; nothing is published.
#
# Not here: anything needing an audio or MIDI device, a GPU, third-party plugins
# or GitHub access (see docs/WINDOWS_SUPPORT.md for the manual checks).

name: Windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión para el paquete (p. ej. 0.2.0); vacío = la de git (la última etiqueta)"
        required: false

# It only reads the repository (and keeps its artifacts).
permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      # Actions pinned to a commit (their tag in the comment): a moved tag can't
      # change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The tags too: the package's version comes from the last one
          # (git describe), not from Cargo.toml's placeholder.
          fetch-depth: 0

      # The Rust of rust-toolchain.toml (rustup installs it on first use), as in
      # every other build.
      - name: Rust
        run: |
          rustup show active-toolchain
          rustc -Vv
          cargo -V

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Compilar (todo el workspace)
        id: compilar
        run: cargo build --release --locked --workspace --all-targets 2>&1 | Tee-Object -FilePath build.log; if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Lint for information only: the code keeps its own hand style (no rustfmt,
      # see docs/BUILD_WINDOWS.md) and clippy's suggestions aren't gates yet.
      - name: Clippy (informativo)
        continue-on-error: true
        run: cargo clippy --release --locked --workspace --all-targets 2>&1 | Tee-Object -FilePath clippy.log

      - name: Tests
        run: |
          cargo test --release --locked --workspace --no-fail-fast 2>&1 | Tee-Object -FilePath tests.log
          $code = $LASTEXITCODE
          Select-String -Path tests.log -Pattern '^test result|FAILED|panicked' | ForEach-Object { $_.Line }
          exit $code

      # From here on, the steps also run when a test failed (the job still
      # fails, because of the Tests step): a red test must not hide whether
      # Pulse packages, renders, starts and installs. They need the build, and
      # the ones after packaging need the package.
      - name: Instalar Inno Setup
        if: ${{ !cancelled() && steps.compilar.outcome == 'success' }}
        run: choco install innosetup -y --no-progress

      - name: Empaquetar
        id: paquete
        if: ${{ !cancelled() && steps.compilar.outcome == 'success' }}
        run: |
          $version = '${{ github.event.inputs.version }}'
          if ($version) { pwsh scripts/package-windows.ps1 -Version $version } else { pwsh scripts/package-windows.ps1 }

      - name: Sumas SHA-256
        if: ${{ !cancelled() && steps.paquete.outcome == 'success' }}
        run: |
          Push-Location dist
          Get-ChildItem -File | Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*-setup.exe' } | ForEach-Object { "$((Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: pulse.exe renderiza un proyecto
        if: ${{ !cancelled() && steps.paquete.outcome == 'success' }}
        run: |
          $exe = 'dist\Pulse\pulse.exe'
          $out = Join-Path $env:RUNNER_TEMP 'demo con espacios ñ.wav'
          $p = Start-Process -FilePath $exe -ArgumentList '--render', "`"$out`"" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "--render salió con $($p.ExitCode)" }
          $size = (Get-Item $out).Length
          Write-Host "WAV de $size bytes"
          if ($size -lt 100000) { throw "WAV demasiado pequeño" }
          Copy-Item $out dist\render-demo.wav

      # continue-on-error: GitHub's runner has no GPU, and wgpu may need the
      # WARP software adapter there (docs/WINDOWS_SUPPORT.md, item 5), which
      # says nothing about real machines. A failure isn't hidden: the next
      # step turns it into a warning on the run's summary page.
      - name: pulse.exe arranca su ventana (guion)
        id: ventana
        if: ${{ !cancelled() && steps.paquete.outcome == 'success' }}
        continue-on-error: true
        run: |
          $out = Join-Path (Get-Location) 'dist\arranque'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $env:PULSE_SCRIPT = (Resolve-Path 'scripts\ci\arranque.txt').Path
          $env:PULSE_SCRIPT_OUT = $out
          $p = Start-Process -FilePath 'dist\Pulse\pulse.exe' -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; throw 'Pulse no terminó el guion en 3 minutos' }
          Get-Content (Join-Path $out 'log.txt')
          Get-ChildItem $out -Filter *.ppm | ForEach-Object { python scripts\ppm.py $_.FullName ($_.FullName -replace '\.ppm$', '.png') }
          if (Select-String -Path (Join-Path $out 'log.txt') -Pattern 'ERROR' -Quiet) { throw 'El guion tuvo errores' }
          if (-not (Test-Path (Join-Path $out 'proyecto.json'))) { throw 'El guion no llegó al final' }
          Get-ChildItem "$env:LOCALAPPDATA\Pulse\Logs" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }

      - name: Aviso si la ventana no arrancó
        # (!cancelled(): without a status function GitHub adds success(), and
        # after a failed test the warning would never show.)
        if: ${{ !cancelled() && steps.ventana.outcome == 'failure' }}
        run: Write-Host "::warning title=La ventana de Pulse no arrancó::El paso «pulse.exe arranca su ventana (guion)» falló; el trabajo sigue por continue-on-error. Mira su registro y el artefacto registros-windows (dist/arranque)."

      - name: El instalador instala, asocia .pulse y desinstala
        if: ${{ !cancelled() && steps.paquete.outcome == 'success' }}
        run: |
          $setup = Get-ChildItem dist -Filter 'Pulse-*-windows-x64-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'No hay instalador' }
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', "/LOG=$(Join-Path (Get-Location) 'dist\instalacion.log')" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "El instalador salió con $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Pulse'
          $exe = Join-Path $app 'pulse.exe'
          if (-not (Test-Path $exe)) { throw "No está $exe" }
          Write-Host "Instalado: $exe, versión $((Get-Item $exe).VersionInfo.ProductVersion)"
          $command = (Get-ItemProperty 'HKCU:\Software\Classes\Pulse.Proyecto\shell\open\command').'(default)'
          Write-Host ".pulse se abre con: $command"
          if ($command -notlike "*pulse.exe*") { throw '.pulse no está asociado' }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Pulse.lnk")) { throw 'Falta el acceso del menú Inicio' }
          # The user's data stays after uninstalling.
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\Pulse" | Out-Null
          Set-Content "$env:APPDATA\Pulse\settings.json" '{}'
          $p = Start-Process -FilePath (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "El desinstalador salió con $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw 'pulse.exe sigue tras desinstalar' }
          if (Test-Path 'HKCU:\Software\Classes\Pulse.Proyecto') { throw 'La asociación sigue tras desinstalar' }
          if (-not (Test-Path "$env:APPDATA\Pulse\settings.json")) { throw 'Desinstalar borró los ajustes del usuario' }
          Write-Host 'Instalar y desinstalar: bien'

      - name: Guardar paquetes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pulse-windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: warn

      - name: Guardar registros y capturas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registros-windows
          path: |
            build.log
            clippy.log
            tests.log
            dist/arranque/
            dist/render-demo.wav
            dist/instalacion.log
          if-no-files-found: warn
